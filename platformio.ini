; PlatformIO Project Configuration File
;
; --------------------------------------------------
;  j4_display_right / SeeedStudio XIAO ESP32S3
;  Pot-label display (right, landscape) for Johnny 4
;  controller. Reads 4 pots (IRIS, COLOR, BRIGHTNESS,
;  VOLUME) via an ADS1115 and streams them to the TTGO
;  over UART; drives 3.5" ILI9488 480x320 SPI TFT.
;
;  Environments:
;    xiao-esp32s3   normal firmware (src/main.cpp)
;    diag-ili9488   \
;    diag-st7796     >  TFT bring-up diagnostic
;    diag-ili9486   /   (src/diag/tft_diag.cpp)
;  See "TFT bring-up diagnostic" in README.md.
; --------------------------------------------------
[platformio]
default_envs = xiao-esp32s3

; Board and upload settings shared by every environment.
[env]
platform    = espressif32
board       = seeed_xiao_esp32s3
framework   = arduino

monitor_speed = 115200
upload_speed         = 115200
upload_protocol      = esptool
; XIAO ESP32S3 has native USB (no UART bridge). The esptool stub loader
; often fails flash comms over the USB-serial-JTAG link ("Unable to verify
; flash chip connection"), so skip it and use the ROM loader directly.
upload_flags         = --no-stub


; --------------------------------------------------
;  Normal firmware
; --------------------------------------------------
[env:xiao-esp32s3]
; src/diag/ holds the bring-up diagnostic and its own setup()/loop(), so it is
; excluded here and everything else is excluded from the diag builds.
build_src_filter = +<*> -<diag/>

build_flags =
  ; USB CDC as Serial (debug), leaves UART0 hardware pins free
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; TFT_eSPI -- ILI9488 @ 480x320
  -DUSER_SETUP_LOADED
  -DILI9488_DRIVER
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=8
  -DTFT_MOSI=9
  -DTFT_SCLK=7
  -DTFT_CS=4
  -DTFT_DC=3
  -DTFT_RST=2
  -DTFT_BL=1
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  -DSMOOTH_FONT

lib_deps =
  https://github.com/Bodmer/TFT_eSPI.git
  RobTillaart/ADS1X15@0.3.13


; --------------------------------------------------
;  TFT bring-up diagnostic
;
;  Same pin map as the normal firmware, but the SPI clock drops to 10 MHz (the
;  ILI9488 is specified to about 20 MHz for writes, and 27 MHz over jumper wire
;  is optimistic) and the driver is the one variable. These red 480x320 modules
;  ship as ILI9488, ILI9486 or ST7796 with identical silkscreen and pinout, so
;  flash each env in turn: the one that paints identifies the panel.
;
;  Builds src/diag/ only. No ADS1115 and no UART link, so it runs with the pots
;  and the TTGO unplugged.
; --------------------------------------------------
[diag_base]
build_src_filter = -<*> +<diag/>

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=8
  -DTFT_MOSI=9
  -DTFT_SCLK=7
  -DTFT_CS=4
  -DTFT_DC=3
  -DTFT_RST=2
  -DTFT_BL=1
  -DTFT_BACKLIGHT_ON=HIGH
  ; deliberately slow: takes marginal wiring out of the picture
  -DSPI_FREQUENCY=10000000
  -DSPI_READ_FREQUENCY=8000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_GFXFF

lib_deps =
  https://github.com/Bodmer/TFT_eSPI.git

[env:diag-ili9488]
extends     = diag_base
build_flags = ${diag_base.build_flags} -DILI9488_DRIVER

[env:diag-st7796]
extends     = diag_base
build_flags = ${diag_base.build_flags} -DST7796_DRIVER

[env:diag-ili9486]
extends     = diag_base
build_flags = ${diag_base.build_flags} -DILI9486_DRIVER
